[package]
name = "pistachio"
description = "A lean desktop GUI for the pi coding agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pistachio"
path = "src/main.rs"

[dependencies]
platform.workspace = true
gpui-kit.workspace = true
deepsearch.workspace = true
python-tool.workspace = true
documents.workspace = true
local-models.workspace = true
sandbox.workspace = true
pi-config.workspace = true
pi-rpc.workspace = true
pi-sessions.workspace = true
python-env.workspace = true
remote.workspace = true
searxng.workspace = true
transcript.workspace = true
titles.workspace = true
workspace.workspace = true
term.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
base64 = "0.23"
trash = "5"
# The vendored GPUI list (src/ui/list.rs); keep it at the version gpui-kit locks.
sum_tree = { package = "gpui-pre-sum-tree", version = "=0.3.14" }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Local speech to text (src/stt): sherpa-onnx links its prebuilt static libraries.
sherpa-onnx = "2.0.3"
# Finds file names in answers (src/chat/file_links.rs); the version gpui-kit already links.
markdown = "1.0.0"
# Draws formulas in answers (src/chat/math.rs): KaTeX's layout and fonts, flattened to paths by
# usvg, the version katex-native's resvg uses.
katex-native = { version = "0.1.1", features = ["raster"] }
usvg = "0.45.1"
sha2 = "0.10.9"
getrandom = "0.3"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
# Complete highlight queries for grammars gpui-kit ships incomplete (see src/syntax.rs).
# Keep these at the versions gpui-kit itself locks, so each grammar is compiled once.
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"

# The window captured behind the update prompt to blur it (see vendor/README.md); the
# version gpui-kit locks.
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "tiff"] }
smallvec = "1.16.6"

[build-dependencies]
# The Windows executable's icon and version information (build.rs); the version GPUI uses.
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = "=0.3.14"

[dev-dependencies]
pretty_assertions.workspace = true
futures.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Linux packages, built by the release workflow (`cargo deb`, `cargo generate-rpm`) after
# `cargo build --release`; it writes target/release/THIRD-PARTY-LICENSES.txt first.
[package.metadata.deb]
maintainer = "Sebastian Yde Madsen <75695915+seba2390@users.noreply.github.com>"
extended-description = "A fast, native desktop app for the pi coding agent (https://pi.dev), written in Rust. Needs pi: npm i -g @earendil-works/pi-coding-agent"
section = "devel"
depends = "$auto"
assets = [
    ["target/release/pistachio", "usr/bin/", "755"],
    ["../../packaging/linux/pistachio.desktop", "usr/share/applications/", "644"],
    ["assets/app-icon/icon-512.png", "usr/share/icons/hicolor/512x512/apps/pistachio.png", "644"],
    ["../../README.md", "usr/share/doc/pistachio/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/pistachio/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/pistachio/", "644"],
    ["target/release/THIRD-PARTY-LICENSES.txt", "usr/share/doc/pistachio/", "644"],
]

[package.metadata.generate-rpm]
summary = "Native desktop app for the pi coding agent"
assets = [
    { source = "target/release/pistachio", dest = "/usr/bin/pistachio", mode = "755" },
    { source = "../../packaging/linux/pistachio.desktop", dest = "/usr/share/applications/pistachio.desktop", mode = "644" },
    { source = "assets/app-icon/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/pistachio.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/pistachio/README.md", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/pistachio/LICENSE-MIT", mode = "644", doc = true },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/pistachio/LICENSE-APACHE", mode = "644", doc = true },
    { source = "target/release/THIRD-PARTY-LICENSES.txt", dest = "/usr/share/licenses/pistachio/THIRD-PARTY-LICENSES.txt", mode = "644", doc = true },
]
