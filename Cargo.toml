[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party crates (see vendor/README.md): dependencies, not workspace members.
exclude = ["vendor"]
default-members = ["crates/app"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/seba2390/pistachio"

[workspace.dependencies]
# Internal crates
deepsearch = { path = "crates/deepsearch" }
documents = { path = "crates/documents" }
local-models = { path = "crates/local-models" }
pi-config = { path = "crates/pi-config" }
pi-install = { path = "crates/pi-install" }
pi-rpc = { path = "crates/pi-rpc" }
pi-sessions = { path = "crates/pi-sessions" }
platform = { path = "crates/platform" }
python-env = { path = "crates/python-env" }
python-tool = { path = "crates/python-tool" }
remote = { path = "crates/remote" }
sandbox = { path = "crates/sandbox" }
searxng = { path = "crates/searxng" }
transcript = { path = "crates/transcript" }
titles = { path = "crates/titles" }
workspace = { path = "crates/workspace" }
term = { path = "crates/term" }

# UI. gpui-kit pins the matching `gpui-pre` snapshot; keep it exact (pre-1.0).
# Syntax colors (models.json, SKILL.md, chat code blocks): `tree-sitter` brings JSON, and
# each `tree-sitter-<lang>` one more grammar. Only these are compiled in; each adds to the
# binary, so add languages deliberately.
gpui-kit = { version = "=0.11.0", default-features = false, features = [
    # Linux: X11 sessions. Wayland is always built in, and used where there is one.
    "x11",
    "component",
    "assets",
    # Microphone capture and the speech widgets; the recognizer is our own (src/stt).
    "speech",
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }

# Shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the key order of files the GUI rewrites (models.json).
serde_json = { version = "1", features = ["preserve_order"] }
async-channel = "2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
dirs = "7"
fastrand = "2"
ignore = "0.4"
notify = "8"
alacritty_terminal = "0.26"

# Testing
insta = { version = "1", features = ["json", "redactions"] }
pretty_assertions = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight GPUI's builder/closure style or add noise.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
similar_names = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"         # `use gpui_kit::*` is GPUI's convention
unused_self = "allow"              # GPUI action handlers take `&mut self`
used_underscore_binding = "allow"  # retained `_task`/`_subscription` fields
single_match_else = "allow"
match_same_arms = "allow"
redundant_closure_for_method_calls = "allow"  # `entity.update(cx, |x, cx| x.f(cx))` is GPUI idiom
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# Keep debug builds snappy for UI work while compiling dependencies optimised.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# GPUI's macOS backend with a lower-latency frame pacing, and gpui-base's Markdown with dollar
# amounts as prose; see vendor/README.md. Keep the versions in step with what gpui-kit pins.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
