name: Release

# Push a tag like `v0.2.0` to build the apps and publish a GitHub release. tag-release.yml does
# it when a release is merged into main.
#
# Caches: a run for a tag can restore only caches saved on main (or for that tag), so the builds
# restore what release-cache.yml saves on main under the same keys (`release-<platform>`; keep the
# env below the same in both: the keys include it) and save nothing themselves.
# Logs: script/ci-build.sh records memory, disk and CPU while building and writes a summary; the
# build log, those samples and cargo's timings report are uploaded as `build-log-<platform>`,
# also after a failure. The release's files are the `asset-*` artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI_MONITOR_SECONDS: 30

jobs:
  macos:
    # Apple Silicon only: Intel Macs are not built for since 0.4.7 (0.4.6 was the last
    # universal release). The zip's name says so, which also keeps updaters from 0.4.6 and
    # earlier, which look for the `-macos-universal.zip`, from installing it on an Intel Mac.
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-macos
          save-if: false
      # sherpa-onnx-sys downloads its prebuilt libraries into target/sherpa-onnx-prebuilt and
      # skips the download whenever that folder's lib/ exists. rust-cache keeps the folder and
      # the build script's fingerprint but not the library files, so linking then fails. If
      # the library itself is missing, drop the folder and the crate's build outputs.
      - name: Re-fetch sherpa-onnx libraries the cache dropped
        shell: bash
        run: |
            if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              rm -rf target/sherpa-onnx-prebuilt \
                target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
                target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
            fi
      # A normal build takes 15-25 minutes; one that stalls fails here, with its logs.
      - name: Build
        timeout-minutes: 60
        shell: bash
        run: script/ci-build.sh --release --locked --target aarch64-apple-darwin
      - name: Build report
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: script/ci-build.sh --report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-macos
          path: target/ci-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Bundle Pistachio.app
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/pistachio target/release/pistachio
          script/bundle-macos.sh release
          res=target/release/Pistachio.app/Contents/Resources
          cp LICENSE-MIT LICENSE-APACHE "$res/"
          python3 script/third-party-licenses.py aarch64-apple-darwin > "$res/THIRD-PARTY-LICENSES.txt"
          codesign --force --sign - target/release/Pistachio.app
          name="Pistachio-${GITHUB_REF_NAME}-macos-arm64.zip"
          (cd target/release && ditto -c -k --keepParent Pistachio.app "$name")
          echo "ASSET=target/release/$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: asset-macos
          path: ${{ env.ASSET }}
          # Publish needs them only in this run; the release keeps them (and doesn't count
          # toward the Actions storage quota, which 90 days of copies filled).
          retention-days: 1

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libzstd-dev libasound2-dev rpm
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-linux-${{ matrix.arch }}
          save-if: false
      # sherpa-onnx-sys downloads its prebuilt libraries into target/sherpa-onnx-prebuilt and
      # skips the download whenever that folder's lib/ exists. rust-cache keeps the folder and
      # the build script's fingerprint but not the library files, so linking then fails. If
      # the library itself is missing, drop the folder and the crate's build outputs.
      - name: Re-fetch sherpa-onnx libraries the cache dropped
        shell: bash
        run: |
            if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              rm -rf target/sherpa-onnx-prebuilt \
                target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
                target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
            fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      # A normal build takes 15-25 minutes; one that stalls fails here, with its logs.
      - name: Build
        timeout-minutes: 60
        shell: bash
        run: script/ci-build.sh --release --locked
      - name: Build report
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: script/ci-build.sh --report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-linux-${{ matrix.arch }}
          path: target/ci-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Package (.tar.gz, .deb, .rpm)
        run: |
          mkdir -p dist
          python3 script/third-party-licenses.py ${{ matrix.arch }}-unknown-linux-gnu \
            > target/release/THIRD-PARTY-LICENSES.txt
          dir="pistachio-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "$dir"
          cp target/release/pistachio target/release/THIRD-PARTY-LICENSES.txt "$dir/"
          cp packaging/linux/pistachio.desktop packaging/linux/install.sh "$dir/"
          cp crates/app/assets/app-icon/icon-512.png "$dir/pistachio.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "dist/$dir.tar.gz" "$dir"
          cargo deb -p pistachio --no-build --output dist/
          cargo generate-rpm -p crates/app --output dist/
          ls -l dist
      - name: Check the packages
        run: |
          rpm -qpl dist/*.rpm
          rpm -qpR dist/*.rpm
          sudo apt-get install -y ./dist/*.deb
          dpkg -L pistachio
          test -x /usr/bin/pistachio
          sudo apt-get remove -y pistachio
      - uses: actions/upload-artifact@v7
        with:
          name: asset-linux-${{ matrix.arch }}
          path: dist/*
          # Publish needs them only in this run; the release keeps them (and doesn't count
          # toward the Actions storage quota, which 90 days of copies filled).
          retention-days: 1

  # On a newer Ubuntu than the build's: the software renderer of 22.04 (Mesa 23.2) leaves the app's
  # X11 window black. That of 24.04 does not.
  linux-displays:
    name: Linux (${{ matrix.arch }}) opens on X11 and Wayland
    needs: linux
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: asset-linux-${{ matrix.arch }}
          path: dist
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb \
            xvfb openbox x11-utils x11-apps imagemagick sway grim mesa-vulkan-drivers dbus \
            fonts-dejavu-core
      - run: dbus-run-session -- script/check-linux-displays.sh /usr/bin/pistachio displays
      - uses: actions/upload-artifact@v7
        # Also for a tag (only the asset-* artifacts are published): what the windows showed.
        if: always()
        with:
          name: displays-${{ matrix.arch }}
          path: displays
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-windows
          save-if: false
      # sherpa-onnx-sys downloads its prebuilt libraries into target/sherpa-onnx-prebuilt and
      # skips the download whenever that folder's lib/ exists. rust-cache keeps the folder and
      # the build script's fingerprint but not the library files, so linking then fails. If
      # the library itself is missing, drop the folder and the crate's build outputs.
      - name: Re-fetch sherpa-onnx libraries the cache dropped
        shell: bash
        run: |
            if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              rm -rf target/sherpa-onnx-prebuilt \
                target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
                target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
            fi
      # A normal build takes 15-25 minutes; one that stalls fails here, with its logs.
      - name: Build
        timeout-minutes: 60
        shell: bash
        run: script/ci-build.sh --release --locked
      - name: Build report
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: script/ci-build.sh --report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log-windows
          path: target/ci-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Package
        shell: bash
        run: |
          dir="pistachio-${GITHUB_REF_NAME}-windows-x86_64"
          mkdir -p "$dir"
          cp target/release/pistachio.exe "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          python script/third-party-licenses.py x86_64-pc-windows-msvc > "$dir/THIRD-PARTY-LICENSES.txt"
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"
      # The installer (packaging/windows/pistachio.iss), from the same files as the zip, which
      # stays for the app's own updates (updater.rs) and for running without installing.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "Pistachio-$env:GITHUB_REF_NAME-windows-x86_64-setup"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\$env:PACKAGE_DIR" "/O$PWD" "/F$name" packaging\windows\pistachio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          # Next to the zip: an artifact keeps its files' folders, and publishing takes only the
          # files at the top of each.
          "SETUP=$name.exe" >> $env:GITHUB_ENV
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = Resolve-Path $env:SETUP
          $p = Start-Process -Wait -PassThru $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log'
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "setup exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Pistachio"
          Get-ChildItem $app
          if (-not (Test-Path "$app\pistachio.exe")) { throw "pistachio.exe was not installed" }
          $info = (Get-Item "$app\pistachio.exe").VersionInfo
          "pistachio.exe: $($info.FileDescription) $($info.ProductVersion)"
          if ($info.ProductName -ne 'Pistachio') { throw "pistachio.exe has no version information" }
          $start = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pistachio.lnk"
          if (-not (Test-Path $start)) { throw "no Start menu shortcut" }
          $p = Start-Process -Wait -PassThru "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$app\pistachio.exe") { throw "uninstalling left pistachio.exe" }
      - uses: actions/upload-artifact@v7
        with:
          name: asset-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.SETUP }}
          # Publish needs them only in this run; the release keeps them (and doesn't count
          # toward the Actions storage quota, which 90 days of copies filled).
          retention-days: 1

  publish:
    name: Publish release
    needs: [macos, linux, linux-displays, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # A deploy key with write access to seba2390/homebrew-tap.
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      # The release's files only, not the build logs.
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          script/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "TITLE=Pistachio $version" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: ${{ env.TITLE }}
          body_path: ${{ runner.temp }}/notes.md
      # `brew install --cask seba2390/tap/pistachio` follows stable releases (not `v1.2.3-beta`).
      - name: Update the Homebrew cask
        if: env.TAP_KEY != '' && !contains(github.ref_name, '-')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum "dist/Pistachio-${GITHUB_REF_NAME}-macos-arm64.zip" | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:seba2390/homebrew-tap.git tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/pistachio.rb
          # Apple Silicon only since 0.4.7: the cask's file name, and brew refuses Intel Macs
          # (which keep 0.4.6) instead of installing an app they can't run.
          perl -0pi -e 's/-macos-universal\.zip/-macos-arm64.zip/g;
            s/^  depends_on macos: /  depends_on arch: :arm64\n  depends_on macos: /m
              unless /^  depends_on arch: :arm64$/m' Casks/pistachio.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pistachio $version" && git push
